name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which platform to build'
        type: choice
        default: all
        options: [all, ios, macos, android, windows, extension]
      publish:
        description: 'Upload to TestFlight / Play (otherwise build artifacts only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: ./scripts/release/version.sh

  android:
    needs: version
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: extractions/setup-just@v3

      - name: Materialise gitignored config
        run: ./scripts/release/bootstrap.sh
        env:
          DOTENV:                    ${{ secrets.DOTENV }}
          FIREBASE_OPTIONS_DART:     ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON:      ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - run: just release android
        env:
          ANDROID_KEYSTORE_B64:   ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Play (internal track)
        if: ${{ env.PUBLISH == 'true' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.solidsoft.routine
          releaseFiles: dist/Routine.aab
          track: internal
          status: completed

      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/*.apk }

  ios:
    needs: version
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.2', bundler-cache: true, working-directory: ios }
      - uses: extractions/setup-just@v3

      - name: Materialise gitignored config
        run: ./scripts/release/bootstrap.sh
        env:
          DOTENV:                    ${{ secrets.DOTENV }}
          FIREBASE_OPTIONS_DART:     ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON:      ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - run: flutter pub get

      - name: Build and upload to TestFlight
        run: just release ios
        env:
          ASC_KEY_ID:      ${{ env.PUBLISH == 'true' && secrets.ASC_KEY_ID || '' }}
          ASC_ISSUER_ID:   ${{ env.PUBLISH == 'true' && secrets.ASC_ISSUER_ID || '' }}
          ASC_PRIVATE_KEY: ${{ env.PUBLISH == 'true' && secrets.ASC_PRIVATE_KEY || '' }}
          IOS_CERT_P12_B64:  ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build }}

  macos:
    needs: version
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: extractions/setup-just@v3

      - name: Materialise gitignored config
        run: ./scripts/release/bootstrap.sh
        env:
          DOTENV:                    ${{ secrets.DOTENV }}
          FIREBASE_OPTIONS_DART:     ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON:      ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - run: just release macos
        env:
          VERSION_NAME:           ${{ needs.version.outputs.name }}
          BUILD_NUMBER:           ${{ needs.version.outputs.build }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERT_P12_B64:     ${{ secrets.MACOS_CERT_P12_B64 }}
          MACOS_CERT_PASSWORD:    ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID:             ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:          ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY:        ${{ secrets.ASC_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  windows:
    needs: version
    if: ${{ inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: extractions/setup-just@v3

      - name: Materialise gitignored config
        run: ./scripts/release/bootstrap.sh
        env:
          DOTENV:                    ${{ secrets.DOTENV }}
          FIREBASE_OPTIONS_DART:     ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON:      ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - run: just release windows
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build }}

      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  extension:
    if: ${{ inputs.platform == 'extension' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: extractions/setup-just@v3

      - name: Install web-ext
        if: ${{ env.PUBLISH == 'true' }}
        run: npm install -g web-ext

      - run: just build-ext
        env:
          AMO_JWT_ISSUER:    ${{ env.PUBLISH == 'true' && secrets.AMO_JWT_ISSUER || '' }}
          AMO_JWT_SECRET:    ${{ env.PUBLISH == 'true' && secrets.AMO_JWT_SECRET || '' }}
          CWS_CLIENT_ID:     ${{ env.PUBLISH == 'true' && secrets.CWS_CLIENT_ID || '' }}
          CWS_CLIENT_SECRET: ${{ env.PUBLISH == 'true' && secrets.CWS_CLIENT_SECRET || '' }}
          CWS_REFRESH_TOKEN: ${{ env.PUBLISH == 'true' && secrets.CWS_REFRESH_TOKEN || '' }}
          CWS_EXTENSION_ID:  ${{ env.PUBLISH == 'true' && secrets.CWS_EXTENSION_ID || '' }}

      - uses: actions/upload-artifact@v4
        with: { name: extension, path: browser/web-ext-artifacts/*.zip }

  release:
    needs: [version, android, ios, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - run: ./scripts/release/notes.sh > notes.md
        env:
          VERSION_NAME:     ${{ needs.version.outputs.name }}
          TESTFLIGHT_URL:   ${{ vars.TESTFLIGHT_URL }}
          PLAY_TESTING_URL: ${{ vars.PLAY_TESTING_URL }}

      - uses: softprops/action-gh-release@v2
        with:
          name: Routine ${{ needs.version.outputs.name }}
          body_path: notes.md
          files: artifacts/**/*
          draft: true
